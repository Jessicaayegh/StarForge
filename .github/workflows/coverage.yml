# Code coverage (cargo-llvm-cov)
#
# Runs the full test suite once under LLVM source-based instrumentation and
# renders every report format from that single run (LCOV for Codecov and
# IDE gutters, a JSON summary, and a browsable HTML report). The line / region
# / function totals are also written to the job summary so reviewers can see
# them without downloading anything.
#
# Gating: the job fails if the tests fail. A minimum coverage percentage is
# enforced only when the repository variable COVERAGE_THRESHOLD is set
# (Settings -> Secrets and variables -> Actions -> Variables), e.g. "60".
#
# Local equivalent: scripts/coverage.sh, or
#   cargo llvm-cov --locked --html -- --test-threads=1

name: Coverage

on:
  push:
    branches: [master, main]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/**'
      - '.github/workflows/coverage.yml'
  pull_request:
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/**'
      - '.github/workflows/coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  coverage:
    name: Coverage Report (cargo-llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Exposed via env so steps can test for it (the `secrets` context is not
      # allowed in step-level `if:` expressions).
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      COVERAGE_THRESHOLD: ${{ vars.COVERAGE_THRESHOLD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Same test invocation as the `Build and Test` CI job, instrumented.
      - name: Run tests with coverage instrumentation
        run: cargo llvm-cov --locked --no-report -- --test-threads=1

      - name: Render coverage reports
        run: |
          mkdir -p coverage
          cargo llvm-cov report --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --json --summary-only --output-path coverage/coverage-summary.json
          cargo llvm-cov report --html --output-dir coverage
          cargo llvm-cov report --summary-only | tee coverage/summary.txt

      - name: Write job summary
        shell: python3 {0}
        run: |
          import json, os
          totals = json.load(open("coverage/coverage-summary.json"))["data"][0]["totals"]
          lines = ["## Code coverage", "",
                   "| Metric | Covered | Total | Percent |", "|---|---:|---:|---:|"]
          for key in ("lines", "regions", "functions"):
              t = totals[key]
              lines.append(f"| {key} | {t['covered']} | {t['count']} | {t['percent']:.2f}% |")
          lines += ["", "<details><summary>Per-file report</summary>", "", "```",
                    open("coverage/summary.txt").read().rstrip(), "```", "</details>", ""]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines))

      - name: Enforce minimum line coverage
        if: env.COVERAGE_THRESHOLD != ''
        run: cargo llvm-cov report --fail-under-lines "$COVERAGE_THRESHOLD"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      # Optional: only runs when a CODECOV_TOKEN secret is configured, and never
      # fails the job (Codecov outages / fork PRs without the secret).
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          name: starforge-coverage
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false
