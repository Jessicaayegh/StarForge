<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse trusted StarForge templates and plugins for Stellar and Soroban development.">
  <title>StarForge Registry</title>
  <style>
    :root{color-scheme:dark;--bg:#08111f;--panel:#101d31;--panel2:#152640;--text:#edf5ff;--muted:#a8bad2;--accent:#67e8f9;--purple:#a78bfa;--ok:#86efac;--border:#2a3f5e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -20%,#243e67 0,transparent 45%),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:var(--accent)}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.shell{width:min(1180px,calc(100% - 32px));margin:auto}header{padding:28px 0 18px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{text-decoration:none;color:var(--text);font-size:1.25rem;font-weight:800}.brand:hover{color:var(--accent)}nav a{margin-left:18px;text-decoration:none;color:var(--muted)}.hero{padding:64px 0 40px;max-width:820px}.eyebrow{color:var(--accent);font-weight:750;letter-spacing:.1em;text-transform:uppercase;font-size:.78rem}h1{font-size:clamp(2.3rem,6vw,4.7rem);line-height:1.02;margin:14px 0 20px;letter-spacing:-.05em}h2{margin-top:0;letter-spacing:-.025em}.hero p{color:var(--muted);font-size:1.15rem;max-width:680px}.search{display:flex;gap:10px;margin:26px 0 12px}input,select{width:100%;border:1px solid var(--border);border-radius:10px;padding:13px 15px;background:#0b1728;color:var(--text);font:inherit}button{border:0;border-radius:10px;padding:13px 18px;background:linear-gradient(135deg,var(--accent),var(--purple));color:#06111f;cursor:pointer;font:inherit;font-weight:800;white-space:nowrap}button.secondary{background:var(--panel2);border:1px solid var(--border);color:var(--text)}.button-link{display:inline-block;border-radius:10px;padding:11px 15px;background:var(--panel2);border:1px solid var(--border);text-decoration:none;color:var(--text);font-weight:700}.filters{display:grid;grid-template-columns:180px 1fr;gap:10px;margin:18px 0 30px}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:18px 0}.muted,.status{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;padding-bottom:60px}.card,.profile,.detail{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 12px 34px #0003}.card{display:flex;flex-direction:column;min-height:250px}.card h3{margin:0;font-size:1.2rem}.card h3 a{color:var(--text);text-decoration:none}.card h3 a:hover{color:var(--accent)}.version{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85rem}.description{color:var(--muted);flex:1}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tag,.badge{border-radius:99px;padding:3px 9px;font-size:.78rem;background:#213653;color:#dbeafe}.badge{background:#14532d;color:var(--ok)}.meta{display:flex;gap:13px;flex-wrap:wrap;color:var(--muted);font-size:.86rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.back{display:inline-block;margin:28px 0 18px}.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;margin-bottom:60px}.readme{white-space:pre-wrap;overflow-wrap:anywhere;color:#d9e7f8}.readme h3{color:var(--text);margin-top:1.5em}code,pre{background:#07101d;border:1px solid var(--border);border-radius:8px;padding:2px 5px}pre{padding:14px;overflow-x:auto}.side dl{margin:0}.side dt{color:var(--muted);font-size:.82rem;margin-top:14px}.side dd{margin:2px 0;overflow-wrap:anywhere}.empty{border:1px dashed var(--border);border-radius:14px;padding:36px;color:var(--muted);text-align:center;grid-column:1/-1}footer{border-top:1px solid var(--border);padding:24px 0 42px;color:var(--muted);font-size:.9rem}@media(max-width:700px){header{align-items:flex-start}nav a{margin-left:10px}.search{flex-direction:column}.filters,.detail-layout{grid-template-columns:1fr}.hero{padding-top:38px}}@media(prefers-reduced-motion:no-preference){.card{transition:transform .18s ease,border-color .18s ease}.card:hover{transform:translateY(-3px);border-color:var(--purple)}}
  </style>
</head>
<body>
  <header class="shell"><a class="brand" href="#/">✦ StarForge Registry</a><nav aria-label="Primary"><a href="#/">Explore</a><a href="https://github.com/Nanle-code/StarForge" target="_blank" rel="noreferrer">GitHub</a></nav></header>
  <main id="app" class="shell" aria-live="polite"></main>
  <footer><div class="shell">A public catalog for Stellar and Soroban templates. Verify source and license before installing.</div></footer>
  <script>
    const app=document.getElementById("app"),api="/api";
    const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    const enc=v=>encodeURIComponent(v),stars=v=>`${Number(v||0).toFixed(1)} ★`;
    const card=t=>`<article class="card"><div><span class="version">v${esc(t.version)}</span>${t.verified?' <span class="badge">Verified</span>':""}</div><h3><a href="#/template/${enc(t.name)}">${esc(t.name)}</a></h3><p class="description">${esc(t.description)}</p><div class="meta"><a href="#/publisher/${enc(t.author)}">${esc(t.author)}</a><span>${stars(t.ratings?.average_rating)}</span><span>${Number(t.downloads||0).toLocaleString()} downloads</span></div><div class="tags">${(t.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div><div class="actions"><a class="button-link" href="#/template/${enc(t.name)}">View details</a><button class="secondary" data-copy="starforge registry install ${esc(t.name)} --version ${esc(t.version)}">Copy install command</button></div></article>`;
    const loading=()=>`<p class="status">Loading registry data…</p>`,error=m=>`<div class="empty"><strong>Could not load this page.</strong><br>${esc(m)}<br><a href="#/">Return to the registry</a></div>`;
    const markdown=v=>esc(v||"README not provided by the publisher.").replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h3>$1</h3>").replace(/^# (.*)$/gm,"<h3>$1</h3>").replace(/`([^`]+)`/g,"<code>$1</code>");
    async function request(path,options){const r=await fetch(`${api}${path}`,options),b=await r.json();if(!r.ok)throw Error(b.error||`Request failed (${r.status})`);return b}
    async function home(){app.innerHTML=`<section class="hero"><div class="eyebrow">The open template registry</div><h1>Build faster on Stellar.</h1><p>Browse trusted Soroban templates and plugins, inspect their source context, and copy a reproducible install command before you commit.</p><form class="search" id="search"><label for="query" hidden>Search templates</label><input id="query" name="query" placeholder="Search templates, tags, or capabilities" autocomplete="off"><button>Search registry</button></form><div class="filters"><select id="sort" aria-label="Sort templates"><option value="downloads">Most downloaded</option><option value="rating">Highest rated</option><option value="recent">Recently published</option><option value="relevance">Most relevant</option></select><div class="status" id="search-status"></div></div></section><div class="section-head"><h2>Explore templates</h2><span class="muted" id="result-count"></span></div><div class="grid" id="results">${loading()}</div>`;const run=async e=>{e?.preventDefault();const q=document.getElementById("query").value,s=document.getElementById("sort").value,r=document.getElementById("results");r.innerHTML=loading();try{const b=await request("/templates/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q,sort_by:s,limit:50})});document.getElementById("result-count").textContent=`${b.total||0} results`;r.innerHTML=b.results?.length?b.results.map(card).join(""):`<div class="empty">No templates matched that search.</div>`}catch(x){r.innerHTML=error(x.message)}};document.getElementById("search").addEventListener("submit",run);document.getElementById("sort").addEventListener("change",run);run()}
    async function templatePage(name){app.innerHTML=loading();try{const d=await request(`/templates/${enc(name)}`),t=d.template;app.innerHTML=`<a class="back" href="#/">← Back to registry</a><div class="detail-layout"><article class="detail"><div class="eyebrow">Template detail</div><h1>${esc(t.name)} <span class="version">v${esc(t.version)}</span></h1><p class="description">${esc(t.description)}</p><div class="tags">${(t.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div><div class="actions"><button data-copy="starforge registry install ${esc(t.name)} --version ${esc(t.version)}">Copy install command</button>${t.repository?`<a class="button-link" href="${esc(t.repository)}" target="_blank" rel="noreferrer">View source</a>`:""}</div><hr><h2>README</h2><div class="readme">${markdown(t.readme)}</div></article><aside class="detail side"><h2>At a glance</h2><dl><dt>Publisher</dt><dd><a href="#/publisher/${enc(t.author)}">${esc(t.author)}</a></dd><dt>License</dt><dd>${esc(t.license||"Not specified")}</dd><dt>Rating</dt><dd>${stars(t.ratings?.average_rating)} (${t.ratings?.review_count||0} reviews)</dd><dt>Downloads</dt><dd>${Number(t.downloads||0).toLocaleString()}</dd><dt>Versions</dt><dd>${d.versions.map(v=>`<div><code>${esc(v.version)}</code> · ${new Date(v.created_at).toLocaleDateString()}</div>`).join("")}</dd></dl></aside></div>`}catch(x){app.innerHTML=error(x.message)}}
    async function publisherPage(name){app.innerHTML=loading();try{const d=await request(`/templates/publishers/${enc(name)}`);app.innerHTML=`<a class="back" href="#/">← Back to registry</a><div class="profile"><div class="eyebrow">Publisher profile</div><h1>${esc(d.publisher)}</h1><p class="muted">${d.template_count} templates · ${Number(d.total_downloads).toLocaleString()} total downloads</p></div><div class="section-head"><h2>Published templates</h2></div><div class="grid">${d.templates.map(card).join("")}</div>`}catch(x){app.innerHTML=error(x.message)}}
    document.addEventListener("click",e=>{const b=e.target.closest("button[data-copy]");if(!b)return;navigator.clipboard?.writeText(b.dataset.copy).then(()=>{const old=b.textContent;b.textContent="Copied";setTimeout(()=>b.textContent=old,1400)})});
    function route(){const p=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean).map(decodeURIComponent);if(p[0]==="template"&&p[1])return templatePage(p[1]);if(p[0]==="publisher"&&p[1])return publisherPage(p[1]);return home()}window.addEventListener("hashchange",route);route();
  </script>
</body>
</html>
